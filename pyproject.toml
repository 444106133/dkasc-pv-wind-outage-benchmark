[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pv-wind-benchmark"
version = "1.0.0"
description = "PV reference-power estimation and fault-gated online conformal monitoring under persistent wind-telemetry loss"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Abdulhakim M. Bin Dayil", email = "444106133@student.ksu.edu.sa"},
]
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "pyarrow>=15.0.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.5.0",
]

[project.urls]
Repository = "https://github.com/444106133/dkasc-pv-wind-outage-benchmark"

[project.scripts]
pv-wind-benchmark = "pv_wind_benchmark.cli:main"
